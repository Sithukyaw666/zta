[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "uybai"
version = "0.1.1"
description = "Zero Token Architecture™ — Thinks deeply. Charge None"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["ai", "cli", "terminal", "reasoning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Terminals",
]
dependencies = [
    "rich>=13.0",
    "prompt_toolkit>=3.0",
]

[project.scripts]
uyb = "uybai.main:cli"

[project.urls]
Homepage = "https://github.com/sithukyaw666/uybai"
Issues   = "https://github.com/sithukyaw666/uybai/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/uybai"]
